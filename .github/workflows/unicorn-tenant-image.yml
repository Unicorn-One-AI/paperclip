name: UnicornOne Paperclip image

on:
  workflow_dispatch:
    inputs:
      push_latest:
        description: "Also push the latest tag"
        required: false
        default: true
        type: boolean
  push:
    branches:
      - deploy
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

concurrency:
  group: unicorn-paperclip-image-${{ github.ref_name }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  PAPERCLIP_IMAGE_NAME: paperclip
  UNICORN_REPOSITORY: Unicorn-One-AI/Unicorn

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Paperclip
        uses: actions/checkout@v4

      - name: Set image metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          owner="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          paperclip_sha="$(git rev-parse HEAD)"
          paperclip_short_sha="${paperclip_sha:0:12}"
          ref_name="${GITHUB_REF_NAME}"
          ref_type="${GITHUB_REF_TYPE}"
          ref_tag="$(printf '%s' "$ref_name" | tr '/[:upper:]' '-[:lower:]')"
          {
            echo "paperclip_sha=$paperclip_sha"
            echo "paperclip_short_sha=$paperclip_short_sha"
            echo "ref_tag=$ref_tag"
            echo "ref_type=$ref_type"
            echo "paperclip_image=$REGISTRY/$owner/$PAPERCLIP_IMAGE_NAME"
          } >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Paperclip image
        shell: bash
        run: |
          set -euo pipefail
          image="${{ steps.meta.outputs.paperclip_image }}"
          docker build \
            --label org.opencontainers.image.source="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label org.opencontainers.image.revision="${{ steps.meta.outputs.paperclip_sha }}" \
            --tag "$image:paperclip-${{ steps.meta.outputs.paperclip_sha }}" \
            --tag "$image:paperclip-${{ steps.meta.outputs.paperclip_short_sha }}" \
            --tag "$image:${{ steps.meta.outputs.ref_tag }}" \
            .
          if [ "${{ steps.meta.outputs.ref_type }}" = "branch" ] && { [ "${{ steps.meta.outputs.ref_tag }}" = "deploy" ] || [ "${{ steps.meta.outputs.ref_tag }}" = "master" ] || [ "${{ steps.meta.outputs.ref_tag }}" = "main" ]; }; then
            docker tag "$image:paperclip-${{ steps.meta.outputs.paperclip_sha }}" "$image:latest"
          fi
          if [ "${{ inputs.push_latest || false }}" = "true" ]; then
            docker tag "$image:paperclip-${{ steps.meta.outputs.paperclip_sha }}" "$image:latest"
          fi

      - name: Push Paperclip image
        shell: bash
        run: |
          set -euo pipefail
          image="${{ steps.meta.outputs.paperclip_image }}"
          docker push "$image:paperclip-${{ steps.meta.outputs.paperclip_sha }}"
          docker push "$image:paperclip-${{ steps.meta.outputs.paperclip_short_sha }}"
          docker push "$image:${{ steps.meta.outputs.ref_tag }}"
          if docker image inspect "$image:latest" >/dev/null 2>&1; then
            docker push "$image:latest"
          fi

      - name: Trigger tenant image rebuild
        shell: bash
        env:
          UNICORN_REPO_TOKEN: ${{ secrets.UNICORN_REPO_TOKEN }}
          PAPERCLIP_IMAGE: ${{ steps.meta.outputs.paperclip_image }}:paperclip-${{ steps.meta.outputs.paperclip_sha }}
        run: |
          set -euo pipefail
          if [ -z "${UNICORN_REPO_TOKEN:-}" ]; then
            echo "UNICORN_REPO_TOKEN is not set; skipping tenant image rebuild dispatch."
            exit 0
          fi
          curl -fsS \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${UNICORN_REPO_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${UNICORN_REPOSITORY}/actions/workflows/proxy-tenant-image.yml/dispatches" \
            -d "{\"ref\":\"main\",\"inputs\":{\"paperclip_image\":\"${PAPERCLIP_IMAGE}\"}}"

      - name: Summary
        shell: bash
        run: |
          {
            echo "### UnicornOne Paperclip image"
            echo
            echo "- Paperclip SHA: \`${{ steps.meta.outputs.paperclip_sha }}\`"
            echo "- Image: \`${{ steps.meta.outputs.paperclip_image }}:paperclip-${{ steps.meta.outputs.paperclip_sha }}\`"
            echo "- Short tag: \`${{ steps.meta.outputs.paperclip_image }}:paperclip-${{ steps.meta.outputs.paperclip_short_sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
